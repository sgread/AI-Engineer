[project]
name = "recsys"
version = "0.1.0"
description = "Mini 0: film recommender — data pipeline starter kit"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]

[project.scripts]
recsys = "recsys.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
